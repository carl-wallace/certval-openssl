[package]
name = "certval-openssl"
version = "0.1.0-rc.1"
description = """
OpenSSL crypto provider for certval. Performs message digest calculation and certificate signature
verification with the system's OpenSSL 3, so certification path validation can use OpenSSL's FIPS
provider where one is installed rather than an in-process software implementation.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-openssl"
categories = ["cryptography"]
keywords = ["x509", "certval", "openssl", "fips"]
readme = "README.md"
edition = "2021"
rust-version = "1.88"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = []
# Enables certval's software ML-DSA implementation. The provider needs nothing from it, since it
# declines ML-DSA, but without it the ML-DSA collection test has no software verdict to compare
# against and every pair is "no opinion".
pqc = ["certval/pqc"]

[dependencies]
certval = { version = "0.2.0-rc.1", default-features = false, features = ["std", "rsa"] }

const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"

log = "0.4.33"

# The system's OpenSSL, deliberately not the `vendored` feature: a vendored build is compiled from
# source into this binary and is never the validated module a deployment is installed with.
openssl = "0.10.81"
openssl-sys = "0.9.117"
# The pointer accessor for the one verification call made directly; the version openssl uses.
foreign-types = "0.3.2"

[dev-dependencies]
x509-cert = { version = "0.3.0", features = ["hazmat"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
p521 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.0"
signature = "3.0.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# [patch.crates-io]
# certval = { path = "../rust-pki/certval" }
